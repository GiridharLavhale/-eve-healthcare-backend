services:
  db:
    image: postgres:16-alpine
    container_name: eve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
      POSTGRES_DB: eve_healthcare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "EVE Healthcare Backend"
      VERSION: "1.0.0"
      ENVIRONMENT: "production"
      DEBUG: "False"
      DATABASE_URL: "postgresql+psycopg://eve_user:eve_password@db:5432/eve_healthcare"
      JWT_SECRET_KEY: "prod-secret-key-change-this-in-real-production-environments-eve-healthcare"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"

volumes:
  pgdata:
    driver: local
